name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build --product UsageIslandPrototype
      - name: Test
        run: swift test
      - name: Run resilience checks
        run: ./Scripts/verify-resilience.sh
