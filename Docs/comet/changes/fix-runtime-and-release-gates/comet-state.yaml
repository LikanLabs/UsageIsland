acceptance:
  - id: A1
    source: brief.md
    text: "Child `/bin/sh` closes stdout (`exec 1>&-; sleep …`) while still alive:
      stdout EOF is handled once, the stdout handler is unregistered, shutdown
      still completes. Repeat independently for stderr (`exec 2>&-; sleep …`)."
    result: passed
    reason:
      text: ManagedProcessTests.testStdoutEOFUnregistersHandlerWhileChildStaysAlive
        and testStderrEOFUnregistersHandlerWhileChildStaysAlive passed; handlers
        nil at empty availableData.
      truncated: false
  - id: A2
    source: brief.md
    text: Count handler invocations with bounded instrumentation, not a CPU-time
      threshold.
    result: passed
    reason:
      text: Tests use readabilityProbe call/EOF counts, not CPU-time thresholds; swift
        test passed.
      truncated: false
  - id: A3
    source: brief.md
    text: Live composition starts with Codex missing. One refresh fails. The locator
      then succeeds. The next refresh creates the real provider and does not
      publish demo snapshots. The app composition is not rebuilt.
    result: passed
    reason:
      text: LiveCompositionTests.testMissingCodexBecomesAvailableOnLaterRefreshWithoutRebuildingComposition
        passed; LocatingCodexUsageProvider locates on each fetchUsage.
      truncated: false
  - id: A4
    source: brief.md
    text: Pending request id 1 receives one chunk `not
      json\n{"id":1,"result":"accepted"}\n`. The request fails. It does not
      return `accepted`. The same failure occurs when the malformed line and the
      later response arrive in separate chunks.
    result: passed
    reason:
      text: JSONRPCClientTests.testMalformedLineThenValidResponseInSameChunkFailsPendingRequest
        and ...LaterChunk... passed; request does not return accepted.
      truncated: false
  - id: A5
    source: brief.md
    text: A final valid JSON-RPC line without a trailing newline at clean EOF still
      completes the pending request.
    result: passed
    reason:
      text: JSONRPCClientTests.testValidFinalLineWithoutNewlineIsDecodedAtEndOfStream
        passed; readerEnded last-line path only on transportClosed.
      truncated: false
  - id: A6
    source: brief.md
    text: Production polling with more than 100 valid unused notifications still
      completes later `request` calls. Shutdown still finishes the client.
    result: passed
    reason:
      text: CodexUsageProviderTests.testUnusedNotificationsAreDrainedSoLaterFetchesStillSucceed
        passed; drain Task.detached drops notifications.
      truncated: false
  - id: A7
    source: brief.md
    text: "`.github/workflows/release.yml` runs the existing test and resilience
      commands on the tagged commit before `Scripts/package-app.sh` and `gh
      release create`. A deliberate test failure must skip package and publish.
      Do not prove this by publishing a broken GitHub release."
    result: passed
    reason:
      text: ReleaseWorkflowTests.testReleaseJobRunsTestsAndResilienceBeforePackageAndPublish
        passed; YAML has no continue-on-error; GitHub Actions fails the job on a
        failed step.
      truncated: false
  - id: A8
    source: specs/codex-executable-recovery/spec.md
    text: A missing Codex CLI at application launch is a recoverable condition, not
      a permanent provider identity for that process lifetime.
    result: passed
    reason:
      text: makeLiveComposition always installs LocatingCodexUsageProvider; locate
        runs on fetchUsage, not as a permanent UnavailableCodexUsageProvider.
      truncated: false
  - id: A9
    source: specs/codex-executable-recovery/spec.md
    text: Live composition still has a single refresh owner and a single shutdown
      owner.
    result: passed
    reason:
      text: LiveComposition still owns one model refresh path and AppDelegate still
        shuts down the single locating provider.
      truncated: false
  - id: A10
    source: specs/codex-executable-recovery/spec.md
    text: The production Codex adapter locates the `codex` executable at a retryable
